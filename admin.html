<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Arequipa Hands-On</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Externo -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        body { 
            background-color: #F4F8FA; 
            padding: 20px; 
        }
        .admin-container { 
            max-width: 1050px; 
            margin: 0 auto; 
        }
        .admin-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: var(--sombra-card); 
        }
        .login-box { 
            max-width: 400px; 
            margin: 80px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: var(--sombra-card); 
            text-align: center; 
        }
        .table-responsive { 
            background: white; 
            border-radius: 12px; 
            overflow-x: auto; 
            box-shadow: var(--sombra-card); 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
            font-size: 14px; 
        }
        th, td { 
            padding: 14px 18px; 
            border-bottom: 1px solid var(--gris-borde); 
        }
        th { 
            background: #1E4B6E; 
            color: white; 
            font-weight: 700; 
        }
        .badge-status { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-weight: 700; 
            font-size: 12px; 
            display: inline-block;
        }
        .badge-sin-confirmar { 
            background: #FDEBD0; 
            color: #B9770E; 
        }
        .badge-confirmado { 
            background: #D4EFDF; 
            color: #1E8449; 
        }
        .btn-confirm { 
            background: #27AE60; 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .btn-confirm:hover { 
            background: #219150; 
        }
    </style>
</head>
<body>

<!-- VISTA 1: LOGIN POR CLAVE -->
<div id="loginSection" class="login-box">
    <i class="fa-solid fa-user-shield" style="font-size: 40px; color: var(--rojo-carmesi); margin-bottom: 15px;"></i>
    <h3 style="color: var(--rojo-carmesi); margin-bottom: 10px;">Acceso Administrador</h3>
    <p style="font-size: 13px; color: var(--texto-suave); margin-bottom: 20px;">Ingresa la clave para gestionar reservas</p>
    <input type="password" id="adminPass" class="form-control" placeholder="Contraseña de acceso" style="margin-bottom: 15px; text-align: center;">
    <button id="btnLogin" class="btn-cta" style="margin-top: 0;">Ingresar al Panel</button>
</div>

<!-- VISTA 2: PANEL DE GESTIÓN -->
<div id="adminPanel" class="admin-container" style="display: none;">
    <div class="admin-header">
        <div>
            <h2 style="color: var(--rojo-carmesi);"><i class="fa-solid fa-list-check"></i> Gestión de Reservas</h2>
            <p style="font-size: 13px; color: var(--texto-suave);">Confirma pagos de Yape/PLIN y actualiza el bus en tiempo real</p>
        </div>
        <button onclick="location.reload()" class="nav-tab" style="border: 1px solid var(--gris-borde); background: white;"><i class="fa-solid fa-rotate"></i> Actualizar</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Fecha Salida</th>
                    <th>Titular / Registrante</th>
                    <th>Pasajero</th>
                    <th>DNI / Celular</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaReservas">
                <tr><td colspan="6" style="text-align: center; padding: 30px;">Cargando reservas...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = "https://yzyrvvcdnhjlkmgulgjh.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_UEbVumaJxsoq6cy6T6rceA_CY0VAx4k"; 
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const CLAVE_ADMIN = "arequipa2026"; // <-- Tu contraseña de acceso

    document.getElementById('btnLogin').addEventListener('click', () => {
        const pass = document.getElementById('adminPass').value;
        if (pass === CLAVE_ADMIN) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            cargarReservas();
        } else {
            alert("Contraseña incorrecta");
        }
    });

    async function cargarReservas() {
        const tbody = document.getElementById('tablaReservas');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px;">Cargando...</td></tr>';

        try {
            let { data, error } = await supabase
                .from('pasajeros_reservas')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No hay reservas registradas aún.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(res => {
                const tr = document.createElement('tr');
                const esConfirmado = res.estado === 'Confirmado';

                tr.innerHTML = `
                    <td><strong>${res.fecha_tour}</strong></td>
                    <td>DNI: ${res.dni_registrante}<br><small style="color:#666;">Cel: ${res.celular_registrante}</small></td>
                    <td><strong>${res.nombre}</strong></td>
                    <td>DNI: ${res.dni_pasajero}<br><small style="color:#666;">Cel: ${res.celular}</small></td>
                    <td>
                        <span class="badge-status ${esConfirmado ? 'badge-confirmado' : 'badge-sin-confirmar'}">
                            ${res.estado || 'Sin confirmar'}
                        </span>
                    </td>
                    <td>
                        ${!esConfirmado ? 
                            `<button class="btn-confirm" onclick="confirmarReserva(${res.id}, '${res.fecha_tour}')"><i class="fa-solid fa-check"></i> Confirmar</button>` : 
                            '<span style="color: #27AE60; font-weight:700;"><i class="fa-solid fa-circle-check"></i> Listo</span>'
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });

        } catch (e) {
            console.error(e);
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Error al cargar datos.</td></tr>';
        }
    }

    window.confirmarReserva = async function(idReserva, fechaTour) {
        if (!confirm("¿Confirmas que recibiste el Yape/PLIN para esta reserva?")) return;

        try {
            // 1. Cambiar estado del pasajero a Confirmado
            const { error: err1 } = await supabase
                .from('pasajeros_reservas')
                .update({ estado: 'Confirmado' })
                .eq('id', idReserva);

            if (err1) throw err1;

            // 2. Extraer solo la fecha ISO YYYY-MM-DD
            const isoFecha = fechaTour.split(' ')[0];

            // 3. Consultar la salida y actualizar cupos ocupados
            let { data: salida } = await supabase
                .from('salidas_programadas')
                .select('asientos_ocupados')
                .eq('fecha_tour', isoFecha)
                .maybeSingle();

            if (salida) {
                const nuevosOcupados = (salida.asientos_ocupados || 0) + 1;
                await supabase
                    .from('salidas_programadas')
                    .update({ asientos_ocupados: nuevosOcupados })
                    .eq('fecha_tour', isoFecha);
            }

            alert("✅ ¡Reserva confirmada exitosamente!");
            cargarReservas();

        } catch (e) {
            console.error("Error al confirmar:", e);
            alert("Ocurrió un error al intentar actualizar la reserva. Revisa los permisos en Supabase.");
        }
    };
</script>
</body>
</html>
