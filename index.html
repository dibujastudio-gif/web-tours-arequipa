<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arequipa Hands-On Tours</title>
    <!-- Cargamos Supabase directamente en la web -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #d35400; font-size: 24px; }
        .manifiesto { font-size: 13px; color: #7f8c8d; text-align: center; margin-bottom: 25px; line-height: 1.4; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccd1d1; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-whatsapp { background-color: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .btn-whatsapp:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .info-status { font-size: 13px; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏔️ Arequipa Experiencias</h1>
    <p class="manifiesto">Cada tour financia la práctica profesional justa de un egresado de turismo local. Solo operamos Martes, Jueves y Sábados.</p>
    
    <label for="fecha">1. Selecciona tu fecha disponible:</label>
    <!-- Simulamos las fechas del SQL para la prueba -->
    <select id="fecha" onchange="verificarDisponibilidad()">
        <option value="">-- Selecciona un día --</option>
        <option value="2026-10-24">Sábado 24 Oct - Ruta del Sillar</option>
        <option value="2026-10-27">Martes 27 Oct - Ruta del Sillar</option>
        <option value="2026-10-29">Jueves 29 Oct - City Tour</option>
    </select>

    <div id="status" class="info-status"></div>

    <label for="pasajeros">2. Número de Pasajeros:</label>
    <input type="number" id="pasajeros" min="1" max="10" value="1">

    <label for="nombre">3. Tu Nombre:</label>
    <input type="text" id="nombre" placeholder="Ej: Maria Mendoza">

    <button id="btnCotizar" class="btn-whatsapp" onclick="enviarWhatsApp()" disabled>Solicitar Cotización por WhatsApp</button>
</div>

<script>
    // ⚠️ REEMPLAZA ESTOS DATOS CON LOS TUYOS DE SUPABASE
    const SUPABASE_URL = "https://yzyrvvcdnhjlkmgulgjh.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_UEbVumaJxsoq6cy6T6rceA_CY0VAx4k";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function verificarDisponibilidad() {
        const fechaSeleccionada = document.getElementById('fecha').value;
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('btnCotizar');
        
        if (!fechaSeleccionada) { statusDiv.innerText = ""; btn.disabled = true; return; }

        // Consultamos a Supabase en tiempo real cuántos asientos quedan
        let { data, error } = await supabase
            .from('salidas_programadas')
            .select('asientos_ocupados, limite_asientos')
            .eq('fecha_tour', fechaSeleccionada)
            .single();

        if (data) {
            const disponibles = data.limite_asientos - data.asientos_ocupados;
            
            if (disponibles <= 0) {
                statusDiv.innerText = "❌ Agotado para esta fecha. Elige otro día.";
                statusDiv.style.color = "#c0392b";
                btn.disabled = true;
            } else {
                statusDiv.innerText = `🟢 ¡Disponible! Quedan ${disponibles} asientos en la Van.`;
                statusDiv.style.color = "#27ae60";
                btn.disabled = false;
            }
        } else {
            statusDiv.innerText = "🟢 ¡Disponible para apertura!";
            statusDiv.style.color = "#27ae60";
            btn.disabled = false;
        }
    }

    function enviarWhatsApp() {
        const fecha = document.getElementById('fecha').value;
        const pasajeros = document.getElementById('pasajeros').value;
        const nombre = document.getElementById('nombre').value;
        
        if(!nombre) { alert("Por favor pon tu nombre"); return; }

        const numeroTelefono = "+51 988 770 090"; // ⚠️ PON AQUÍ TU NÚMERO DE WHATSAPP REAL
        
        const textoMessage = `🏔️ *¡SOLICITUD DE COTIZACIÓN!*\n\n` +
                             `Hola, quiero reservar asientos:\n` +
                             `🗓️ *Fecha:* ${fecha}\n` +
                             `👥 *Pasajeros:* ${pasajeros}\n` +
                             `👤 *Cliente:* ${nombre}\n\n` +
                             `Quedo a la espera de la cotización y los datos de Yape para confirmar.`;

        const url = `https://wa.me{numeroTelefono}?text=${encodeURIComponent(textoMessage)}`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
